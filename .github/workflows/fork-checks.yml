name: Fork checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    if: github.repository != 'HumanSignal/label-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate fork ownership and action pins
        shell: python
        run: |
          import re
          from pathlib import Path

          owners = [
              line.split()
              for line in Path('.github/CODEOWNERS').read_text().splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          ]
          if ['*', '@bfautomation/ai-engineering'] not in owners:
              raise SystemExit('A repository-wide company CODEOWNER is required.')
          if any(row[1:] != ['@bfautomation/ai-engineering'] for row in owners):
              raise SystemExit('Every CODEOWNERS rule must retain company ownership.')
          workflow = Path('.github/workflows/fork-checks.yml').read_text()
          actions = re.findall(r'(?m)^\s*-?\s*uses:\s*(\S+)', workflow)
          for action in actions:
              if not action.startswith('./') and not re.fullmatch(
                  r'[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}', action
              ):
                  raise SystemExit(f'Action must use a full commit SHA: {action}')
          print('Company ownership and action pins are valid.')

  backend:
    if: github.repository != 'HumanSignal/label-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: labelstudio_test
          POSTGRES_PASSWORD: labelstudio_test
          POSTGRES_DB: labelstudio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labelstudio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DB: ${{ matrix.database }}
      POSTGRE_HOST: localhost
      POSTGRE_PORT: 5432
      POSTGRE_USER: labelstudio_test
      POSTGRE_PASSWORD: labelstudio_test
      POSTGRE_NAME: labelstudio_test
      COLLECT_ANALYTICS: '0'
      SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen --group test
      - name: Check model and migration consistency
        run: uv run python label_studio/manage.py makemigrations --check --dry-run
      - name: Test fork and upstream integration
        run: >-
          uv run pytest -q --tb=short
          label_studio/projects/tests/test_document_upload_migration.py
          label_studio/projects/tests/test_import_status_api.py
          label_studio/core/tests/test_version.py
          label_studio/core/tests/test_redis.py
          label_studio/tests/data_import
          label_studio/tests/data_manager/test_api_tasks.py
      - name: Test converter service
        env:
          PYTHONPATH: services/docling_converter
          DJANGO_SETTINGS_MODULE: docling_converter_service.settings
        run: uv run pytest -c /dev/null -p no:cacheprovider services/docling_converter/tests -q

  frontend:
    if: github.repository != 'HumanSignal/label-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: node --test tools/version/version.test.mjs
      - run: bun test --dom apps/labelstudio/src/pages/DataManager/DocumentUploadModal.test.jsx
      - run: bun run build
        env:
          NODE_ENV: production
          BUILD_NO_SERVER: 'true'

  repository-policy:
    name: repository-policy
    if: always() && github.repository != 'HumanSignal/label-studio'
    needs: [configuration, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every fork check to succeed
        shell: python
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = json.loads(os.environ['JOB_RESULTS'])
          required = {'configuration', 'backend', 'frontend'}
          if set(results) != required:
              raise SystemExit('The required job set is incomplete.')
          unsuccessful = [
              name for name, result in results.items() if result['result'] != 'success'
          ]
          if unsuccessful:
              raise SystemExit('Required jobs did not succeed: ' + ', '.join(unsuccessful))
          print('All required fork checks passed.')
