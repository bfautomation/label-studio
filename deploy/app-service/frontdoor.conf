# Stand-in for App Service's front door: terminates HTTPS and forwards plain HTTP to the app.

# the path without the query string, which can carry secrets such as invite tokens
log_format path_only '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8443 ssl;
    ssl_certificate     /certs/frontdoor.crt;
    ssl_certificate_key /certs/frontdoor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    access_log          /var/log/nginx/access.log path_only;
    # the error log copies the whole request line, query string included, so a request that fails (an app that cannot
    # be reached, say) is not logged there; the access log above still records it
    error_log           /var/log/nginx/error.log crit;

    # leave upload size limits to the app; App Service's own limit is measured on the real platform
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 230s;
    proxy_send_timeout 230s;

    # look the app up on every request, so a replaced app container (new address) is found, as on App Service
    resolver 127.0.0.11 valid=5s;
    set $app http://app:8000;

    location / {
        proxy_pass $app;
        proxy_set_header Host $http_host;
        # always overwritten, so a client cannot claim HTTPS itself
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
